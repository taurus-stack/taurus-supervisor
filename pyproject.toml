[tool.poetry]
name = "taurus-supervisor"
version = "1.0.0"
description = "Taurus Supervisor - General Program Management Daemon"
authors = ["taurus-stackoutlook.com"]
readme = "README.md"
packages = [
    { include = "taurus_supervisor" },
    { include = "taurus_pm" },
]

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
aiohttp = "^3.8.0"
pyyaml = "^6.0"
psutil = "^5.9.0"
cryptography = "^41.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^1.3.0"
black = "*"
isort = "*"
pyinstaller = { version = "^6.0.0", python = ">=3.12,<3.15" }

[tool.poetry.scripts]
taurus-supervisor = "taurus_supervisor.main:main"
taurus-pm = "taurus_pm.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"